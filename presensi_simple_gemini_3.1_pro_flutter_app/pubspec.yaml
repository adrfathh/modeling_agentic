name: attendance_app
description: "Zero-Trust Attendance Protocol — SMA Muhammadiyah Kasihan"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Security & Auth
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3
  crypto: ^3.0.6

  # Network & API
  dio: ^5.7.0
  connectivity_plus: ^6.1.3

  # Offline Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Firebase (FCM)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # Camera & Biometrics
  camera: ^0.11.1
  local_auth: ^2.3.0

  # Location & Geofencing
  geolocator: ^13.0.2

  # QR Code
  qr_flutter: ^4.1.0

  # Charts
  fl_chart: ^0.70.2

  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5

flutter:
  uses-material-design: true

  # Fonts loaded at runtime via google_fonts package
  # To bundle fonts for offline use, add .ttf files to assets/fonts/
  # and uncomment the font family definition below.

  assets:
    - assets/images/
    - assets/icons/
